alias: Notificação Inteligente Dinâmica Completa
description: >-
  Processa avisos de áudio, controlo visual de lâmpadas e alertas persistentes
  no menu do Home Assistant.
fields:
  mensagem:
    name: Mensagem a ditar
    description: O texto que a casa vai converter em voz e registar no painel.
    required: true
    selector:
      text: null
  target_media_player:
    name: Coluna de Destino
    description: Selecione o altifalante que vai reproduzir a mensagem.
    required: true
    selector:
      entity:
        filter:
          - domain: media_player
    default: media_player.avisos_sonoros
  target_luz:
    name: Lâmpada de Aviso
    description: Selecione a lâmpada que vai piscar em caso de alerta (Opcional).
    required: false
    selector:
      entity:
        filter:
          - domain: light
    default: light.antonio
  cor_luz:
    name: Cor do Alerta (RGB)
    description: Escolha a cor para o piscar da lâmpada.
    required: false
    selector:
      color_rgb: {}
    default:
      - 225
      - 107
      - 107
  forcar_prioridade:
    name: Forçar Prioridade Máxima
    description: >-
      Ative se o aviso dever ignorar o silêncio e gerar um alerta fixo no menu
      do sistema.
    required: false
    default: false
    selector:
      boolean: {}
  auxiliar_inicio:
    name: Ajudante Hora de Início
    description: Selecione o input_datetime geral que define o início do silêncio.
    required: true
    selector:
      entity:
        filter:
          - domain: input_datetime
    default: input_datetime.inicio_automatizacoes
  auxiliar_fim:
    name: Ajudante Hora de Fim
    description: Selecione o input_datetime geral que define o fim do silêncio.
    required: true
    selector:
      entity:
        filter:
          - domain: input_datetime
    default: input_datetime.fim_automatizacoes
sequence:
  - action: tts.speak
    target:
      entity_id: tts.google_ai_tts
    data:
      media_player_entity_id: '{{ target_media_player | default(''media_player.avisos_sonoros'', true) }}'
      message: '{{ mensagem | default(''Teste de som do sistema dinâmico.'', true) }}'
      language: pt-PT
  - choose:
      - conditions:
          - condition: template
            value_template: '{{ forcar_prioridade == true }}'
        sequence:
          - action: persistent_notification.create
            data:
              title: 🚨 Alerta Crítico do Sistema
              message: |-
                {{ mensagem }}

                *Registado em: {{ now().strftime('%H:%M:%S') }}*
              notification_id: alerta_critico_central_voz
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ target_luz is defined and target_luz != none and
              states(target_luz) not in ['unknown', 'unavailable'] }}
        sequence:
          - action: scene.create
            data:
              scene_id: estado_anterior_luz_notificacao
              snapshot_entities: '{{ target_luz }}'
          - action: light.turn_on
            target:
              entity_id: '{{ target_luz }}'
            data:
              rgb_color: '{{ cor_luz | default() }}'
              flash: short
          - delay:
              seconds: 3
          - action: scene.turn_on
            target:
              entity_id: scene.estado_anterior_luz_notificacao
